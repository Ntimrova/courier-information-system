# Локальний запуск усієї системи однією командою:
#     docker compose up --build
#
# Після старту:
#   frontend  http://localhost:5173
#   backend   http://localhost:8000
#   Swagger   http://localhost:8000/docs

services:
  db:
    image: postgres:16-alpine
    container_name: cis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-courier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-courier}
      POSTGRES_DB: ${POSTGRES_DB:-courier_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Backend стартує лише тоді, коли база справді приймає запити.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-courier} -d ${POSTGRES_DB:-courier_db}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: cis-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-courier}:${POSTGRES_PASSWORD:-courier}@db:5432/${POSTGRES_DB:-courier_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-secret-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@courier.ua}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-Password123!}
      SEED_ON_START: ${SEED_ON_START:-true}
    ports:
      - '${BACKEND_PORT:-8000}:8000'

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: cis-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - '${FRONTEND_PORT:-5173}:5173'
    volumes:
      # Код монтуємо всередину, щоб правки одразу підхоплювалися,
      # але node_modules лишаємо контейнерні.
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/public:/app/public

volumes:
  postgres-data:
