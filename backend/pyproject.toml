[project]
name = "courier-information-system-backend"
version = "1.0.0"
description = "Backend інформаційної системи локальної кур'єрської компанії (частина 1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # FastAPI навмисно використовує виклики у значеннях за замовчуванням.
    "B008",
    # `str, Enum` дає автоматичну JSON-серіалізацію і сумісність із Pydantic.
    "UP042",
    # Generic-синтаксис PEP 695 ще не підтримується частиною інструментів.
    "UP046",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
