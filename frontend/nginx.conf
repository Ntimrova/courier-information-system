server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Файли зі збірки мають хеш в імені, тож їх можна кешувати надовго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router обробляє маршрути на клієнті: будь-яка адреса,
    # для якої немає файлу, віддає index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
